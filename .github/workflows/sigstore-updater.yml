##
## This workflow has two jobs:
## 1. update-release-sigstore: Regenerates Sigstore attestation files
##    when an existing GitHub release is edited.
## 2. attest-vex: Creates Sigstore attestations for modified OpenVEX
##    files in PRs targeting the vex branch.
##

name: Update Sigstore Files

on:
  release:
    types: [edited]
  pull_request:
    branches: [master]
    paths:
      - 'vex/*.openvex.json'

jobs:
  update-release-sigstore:
    if: github.event_name == 'release'
    permissions:
      contents: write
      attestations: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download release artifacts
        env:
          GH_TOKEN: ${{github.token}}
        run: gh release download ${{github.event.release.tag_name}}
      - name: Copy artifacts
        run: mkdir artifacts; cp *.tar.gz artifacts/
      - name: Attest Distribution Assets with SBoM
        id: attest-sbom
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-path: |
            artifacts/*.tar.gz
            bom.*.json
            bom.*.yml
            bom.*.xml
          sbom-path: bom.spdx.json
      - name: Copy SBoM provenance
        id: sbom-provenance
        shell: bash
        env:
          ATTESTATION: "${{steps.attest-sbom.outputs.bundle-path}}"
        run: |
          shopt -s nullglob
          mkdir attestations
          for FILE in artifacts/*.tar.gz bom.*.xml bom.*.json bom.*.yml; do
            cp "$ATTESTATION" "attestations/$(basename "$FILE").sigstore"
          done
      - name: Update release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: ${{github.event.release.tag_name}}
          files: attestations/*.sigstore

  attest-vex:
    if: >
      github.event_name == 'pull_request' && true
      # github.repository == 'erlang/otp'
    permissions:
      contents: write
      attestations: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Check PR author permission
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
          PR_AUTHOR: ${{github.event.pull_request.user.login}}
          PR_AUTHOR_ID: "${{github.event.pull_request.user.id}}"
        run: |
          # erlang-bot-app[bot] user ID: 232538940
          if [[ "$PR_AUTHOR_ID" == "232538940" ]]; then
            echo "PR opened by erlang-bot-app[bot] (id=$PR_AUTHOR_ID), allowed"
            exit 0
          fi
          PERMISSION=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/{owner}/{repo}/collaborators/$PR_AUTHOR/permission --jq '.role_name')
          if [[ "$PERMISSION" != "admin" && "$PERMISSION" != "maintain" && "$PERMISSION" != "Security Master" ]]; then
            echo "::error::Only maintainers or erlang-bot-app can trigger VEX attestations"
            exit 1
          fi
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{github.head_ref}}
          fetch-depth: 0
      - name: Find modified OpenVEX files
        id: changed
        run: |
          git diff --name-only --diff-filter=AM origin/vex -- 'vex/*.openvex.json' > /tmp/changed-vex.txt
          if [ -s /tmp/changed-vex.txt ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Attest OpenVEX files
        if: steps.changed.outputs.found == 'true'
        id: attest
        uses: actions/attest@afd638254319277bb3d7f0a234ea5484e42edb67 # v2
        with:
          subject-path: 'vex/*.openvex.json'
          predicate-type: https://openvex.dev/ns/v0.2.0
          predicate-path: 'vex/*.openvex.json'
      - name: Commit attestations to PR
        if: steps.changed.outputs.found == 'true'
        shell: bash
        env:
          ATTESTATION: "${{steps.attest.outputs.bundle-path}}"
        run: |
          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            BASENAME=$(basename "$FILE")
            cp "$ATTESTATION" "vex/${BASENAME}.sigstore"
          done < /tmp/changed-vex.txt
          git config user.name "Erlang/OTP"
          git config user.email "otp@erlang.org"
          git add vex/*.sigstore
          git commit -m "Update sigstore attestations for OpenVEX files" || true
          git push
